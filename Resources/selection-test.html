<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<style>body{margin:0;background:white;font-family:system-ui,sans-serif}.reader_toolbar_container{position:absolute;left:calc(100% - 40px);top:calc(100% - 30px)}.toolbarItem_icon{display:block;width:24px;height:24px;background:black}.toolbarItem_text{font-size:12px}</style>
</head><body><h1>选文工具条显示验证</h1>
<div class="reader_toolbar_container" data-wr-role="selectionToolbar"><div class="reader_toolbar_content"><div class="reader_toolbar_itemContainer">
<button class="toolbarItem wr_copy"><span class="toolbarItem_icon"></span><span class="toolbarItem_text">复制</span></button>
<button class="toolbarItem underlineBg"><span class="toolbarItem_icon"></span><span class="toolbarItem_text">马克笔</span></button>
<button class="toolbarItem underlineHandWrite"><span class="toolbarItem_icon"></span><span class="toolbarItem_text">波浪线</span></button>
<button class="toolbarItem underlineStraight"><span class="toolbarItem_icon"></span><span class="toolbarItem_text">直线</span></button>
<button class="toolbarItem review"><span class="toolbarItem_icon"></span><span class="toolbarItem_text">写想法</span></button>
<button class="toolbarItem query"><span class="toolbarItem_icon"></span><span class="toolbarItem_text">AI问书</span></button>
</div></div></div></body></html>
