<iframe title="AI 问书对话测试" class="readerAIChatPanel_frame" srcdoc='<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><base href="https://weread.qq.com/winktemplate/multi-turn"><style>html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#222;color:#888}.ChatSessions_container__test{height:100%;overflow-y:auto;padding:16px;box-sizing:border-box}.UserMessage_card__test{background:#234;padding:10px;border-radius:12px}.UserMessage_text__test{font-size:15px;line-height:22px}.UserMessage_reference__test{font-size:13px;color:#888}.BotMessage_container__test{padding:10px}.pc_markdown-body__test{font-size:15px;line-height:22px}.ChatSuggestion_question_item__test{font-size:14px;line-height:20px;border:1px solid #aaa;background:#333;cursor:pointer}.ChatMenuButton_more_menu__test{width:24px;height:24px}</style></head><body><div class="ChatSessions_container__test"><div class="UserMessage_card__test"><div class="UserMessage_text__test">如何让墨水屏上的阅读更清晰？</div><div class="UserMessage_reference__test">引用：阅读显示测试，第 1 章</div></div><div class="BotMessage_container__test"><div class="pc_markdown-body__test"><h2>清晰阅读的建议</h2><p>使用清晰的黑色文字、白色背景和舒适的行间距。</p><p>较大的字号有助于分辨汉字笔画；页面中的按钮也应保留足够的点击区域。</p><p>引用和推荐问题需要保持清晰的边框和文字，方便查看和继续提问。</p><p>长回答应当在聊天区域内滚动，输入框保持在底部可见。</p><p>这段文字用于检查完整回答的显示和滚动，不会向服务发送问题。</p><p>恢复原始模式后，应当保留放大的字号，并恢复网页的原有颜色。</p></div><div class="BotMessage_button_group__test"><button class="ChatMenuButton_more_menu__test">更多</button><button disabled>不可用</button></div></div><button class="ChatSuggestion_question_item__test" onclick="document.body.dataset.testClicked=String(Number(document.body.dataset.testClicked||0)+1)">怎样选择合适的字号和行距？</button></div></body></html>'></iframe>
